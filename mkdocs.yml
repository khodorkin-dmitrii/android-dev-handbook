site_name: Android Dev Handbook
site_description: Structured Android development handbook
site_url: https://khodorkin-dmitrii.github.io/android-dev-handbook/

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

plugins:
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Android:
      - Overview: android/index.md
      - Android Components: android/components.md
      - Activity, Fragment & Lifecycle: android/activity-fragment-lifecycle.md
      - View System / XML UI: android/view-system-xml-ui.md
      - Context & Resources: android/context-resources.md
      - Background Work & System Behavior: android/background-work-system-behavior.md
      - Storage: android/storage.md
      - Performance & Memory: android/performance-memory.md
  - Compose:
