site_name: Android Dev Handbook
site_description: Structured Android development handbook
site_url: https://khodorkin-dmitrii.github.io/android-dev-handbook/
exclude_docs: |
  includes/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          link: /en/
        - locale: ru
          name: Русский
          build: true
          link: /ru/
          site_description: Структурированный справочник по Android-разработке
          nav_translations:
            Overview: Обзор
            Android Components: Компоненты Android
            Activity, Fragment & Lifecycle: Activity, Fragment & Lifecycle
            View System / XML UI: View System / XML UI
            Context & Resources: Context & Resources
            Background Work & System Behavior: Background Work & System Behavior
            Storage: Storage
            Performance & Memory: Performance & Memory
            Android Canvas: Android Canvas
            OpenGL ES: OpenGL ES
            Vulkan: Vulkan
            Google Filament: Google Filament
            2D and 3D Rendering: 2D и 3D Rendering
            Basics: Основы
            Kotlin vs Java: Kotlin vs Java
            Classes & Types: Классы и типы
            Collections: Collections
            Functions: Functions
            Generics: Generics
            KMP vs KMM vs Compose Multiplatform: KMP, KMM и Compose Multiplatform
            Project Structure and Source Sets: Структура проекта и Source Sets
            Shared vs Platform-Specific Code: Общий и платформенный код
            Architecture and UI Strategies: Архитектура и стратегии UI
            KMP Adoption and Trade-offs: Внедрение KMP и компромиссы
            Compose Basics: Основы Compose
            State & Recomposition: State & Recomposition
            Side Effects: Side Effects
            Compose Navigation: Compose Navigation
            Compose Performance: Performance Compose
            Compose Testing: Testing Compose
            Coroutines Basics: Основы Coroutines
            Coroutine Scopes & Cancellation: Coroutine Scopes & Cancellation
            Flow Basics: Основы Flow
            Flow Operators: Flow Operators
            StateFlow & SharedFlow: StateFlow & SharedFlow
            Lifecycle-aware Collection: Lifecycle-aware Collection
            Architecture Basics: Основы архитектуры
            UI State Architecture: UI State Architecture
            MV* Patterns: MV* Patterns
            Multi-module Architecture: Multi-module Architecture
            Legacy & Refactoring: Legacy & Refactoring
            Java Core: Java Core
            Java Concurrency: Java Concurrency
            Java Exceptions: Java Exceptions
            JVM / Android Runtime: JVM / Android Runtime
            DI Basics: Основы DI
            Dagger / Hilt: Dagger / Hilt
            Koin: Koin
            Legacy DI: Legacy DI
            HTTP / REST: HTTP / REST
            Retrofit / OkHttp: Retrofit / OkHttp
            GraphQL: GraphQL
            gRPC / Protobuf: gRPC / Protobuf
            Android Security Basics: Основы безопасности Android
            HTTPS, TLS and Certificates: HTTPS, TLS и сертификаты
            Certificate Pinning: Certificate Pinning
            Android Keystore and Secure Storage: Android Keystore и безопасное хранение
            OAuth 2.0, PKCE and Token Management: OAuth 2.0, PKCE и управление токенами
            Tools Overview: Обзор инструментов
            In-App Debug Menus: In-App Debug Menus
            Logging and Diagnostic Data: Logging and Diagnostic Data
            Network Inspection: Network Inspection
            Memory Leak Detection: Memory Leak Detection
            Performance Profiling and Benchmarking: Performance Profiling and Benchmarking
            Crash Reporting and Production Monitoring: Crash Reporting and Production Monitoring
            QA-Friendly Debug Builds: QA-Friendly Debug Builds
            Testing Strategy: Стратегия тестирования
            ViewModel Testing: ViewModel Testing
            Coroutines & Flow Testing: Coroutines & Flow Testing
            Android UI Testing: Android UI Testing
            OOP: OOP
            SOLID: SOLID
            Design Patterns: Design Patterns
            Algorithms & Complexity: Algorithms & Complexity
            Memory & Runtime Basics: Memory & Runtime Basics
            RxJava: RxJava

markdown_extensions:
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

hooks:
  - hooks/i18n_url_structure.py

extra_css:
  - stylesheets/extra.css

not_in_nav: |
  pages-review-tracker.md
  shorts.md
  shorts.ru.md

